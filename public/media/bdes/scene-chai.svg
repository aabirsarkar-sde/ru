<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bgC" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4B3A2B"/>
      <stop offset="1" stop-color="#2A2019"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#FFD9A0" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FFD9A0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="counter" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9A8B78"/>
      <stop offset="1" stop-color="#5E5345"/>
    </linearGradient>
    <linearGradient id="alu" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E9E6DF"/>
      <stop offset="0.25" stop-color="#C8C3B9"/>
      <stop offset="0.6" stop-color="#8E897F"/>
      <stop offset="1" stop-color="#4B4740"/>
    </linearGradient>
    <linearGradient id="chai" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#D8A66A"/>
      <stop offset="0.5" stop-color="#B57A3E"/>
      <stop offset="1" stop-color="#7A4A1E"/>
    </linearGradient>
    <linearGradient id="glassC" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.75"/>
      <stop offset="0.2" stop-color="#FFFFFF" stop-opacity="0.15"/>
      <stop offset="0.8" stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="jar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="0.25" stop-color="#EAF2EE" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#C9D8D0" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="flame" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#2D5BFF"/>
      <stop offset="0.6" stop-color="#6FA0FF"/>
      <stop offset="1" stop-color="#FFB14A"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>

  <rect width="800" height="600" fill="url(#bgC)"/>
  <rect width="800" height="600" fill="url(#glow)"/>
  <!-- tarpaulin edge -->
  <path d="M0 0 L800 0 L800 60 Q700 84 600 60 Q500 84 400 60 Q300 84 200 60 Q100 84 0 60 Z" fill="#1E5FA8"/>
  <path d="M0 60 Q100 84 200 60 Q300 84 400 60 Q500 84 600 60 Q700 84 800 60" stroke="#0F3D73" stroke-width="3" fill="none"/>

  <!-- counter -->
  <rect x="0" y="420" width="800" height="180" fill="url(#counter)"/>
  <rect x="0" y="420" width="800" height="6" fill="#C9BCA8"/>
  <g opacity="0.25" stroke="#3A3128" stroke-width="2">
    <path d="M40 470 q30 -6 60 4"/><path d="M500 520 q40 -10 80 2"/><path d="M620 460 q20 4 44 -2"/>
  </g>

  <!-- stove -->
  <g>
    <rect x="80" y="370" width="210" height="54" rx="6" fill="#2E2E2E"/>
    <rect x="80" y="370" width="210" height="10" rx="4" fill="#5A5A5A"/>
    <circle cx="120" cy="404" r="9" fill="#777"/><circle cx="250" cy="404" r="9" fill="#777"/>
    <path d="M150 368 q6 -18 12 0 q6 -18 12 0 q6 -18 12 0 q6 -18 12 0 q6 -18 12 0 q6 -18 12 0" fill="url(#flame)"/>
  </g>

  <!-- dented kettle -->
  <g>
    <path d="M130 360 Q120 250 185 230 Q250 250 240 360 Z" fill="url(#alu)"/>
    <path d="M168 340 q10 -14 22 -4 q8 8 -4 18 q-12 6 -18 -14 z" fill="#6A665E" opacity="0.5"/>
    <path d="M172 336 q6 -6 12 -2" stroke="#F4F1EA" stroke-width="2" fill="none"/>
    <ellipse cx="185" cy="232" rx="30" ry="8" fill="#9A958B"/>
    <circle cx="185" cy="222" r="8" fill="#3A3A3A"/>
    <path d="M140 262 Q185 170 230 262" stroke="#2F2F2F" stroke-width="8" fill="none"/>
    <path d="M236 300 Q280 290 300 250 L308 256 Q292 300 238 320 Z" fill="url(#alu)"/>
    <path d="M142 280 Q136 320 144 352" stroke="#FFFFFF" stroke-width="6" opacity="0.7" fill="none" stroke-linecap="round"/>
    <!-- steam -->
    <g stroke="#FFFFFF" stroke-width="9" fill="none" opacity="0.35" filter="url(#blur)" stroke-linecap="round">
      <path d="M304 246 q-12 -30 8 -56 q20 -26 0 -60"/><path d="M318 238 q14 -30 -2 -62 q-12 -26 10 -52"/>
    </g>
  </g>

  <!-- glass tumblers of chai -->
  <g>
    <g>
      <ellipse cx="380" cy="424" rx="30" ry="5" fill="#000" opacity="0.35"/>
      <path d="M352 334 L408 334 L402 422 L358 422 Z" fill="url(#chai)"/>
      <path d="M350 318 L410 318 L402 422 L358 422 Z" fill="url(#glassC)" stroke="#E8E2D6" stroke-width="1.5"/>
      <g stroke="#FFFFFF" stroke-width="1" opacity="0.35"><line x1="360" y1="322" x2="364" y2="418"/><line x1="372" y1="322" x2="374" y2="418"/><line x1="386" y1="322" x2="386" y2="418"/><line x1="398" y1="322" x2="396" y2="418"/></g>
      <ellipse cx="380" cy="334" rx="28" ry="4" fill="#E8C79B"/>
      <path d="M354 324 L360 416" stroke="#FFFFFF" stroke-width="4" opacity="0.8" stroke-linecap="round"/>
    </g>
    <g>
      <ellipse cx="452" cy="424" rx="30" ry="5" fill="#000" opacity="0.35"/>
      <path d="M424 346 L480 346 L474 422 L430 422 Z" fill="url(#chai)"/>
      <path d="M422 318 L482 318 L474 422 L430 422 Z" fill="url(#glassC)" stroke="#E8E2D6" stroke-width="1.5"/>
      <g stroke="#FFFFFF" stroke-width="1" opacity="0.35"><line x1="432" y1="322" x2="436" y2="418"/><line x1="444" y1="322" x2="446" y2="418"/><line x1="458" y1="322" x2="458" y2="418"/><line x1="470" y1="322" x2="468" y2="418"/></g>
      <ellipse cx="452" cy="346" rx="28" ry="4" fill="#E8C79B"/>
      <path d="M426 324 L432 416" stroke="#FFFFFF" stroke-width="4" opacity="0.8" stroke-linecap="round"/>
    </g>
    <g>
      <ellipse cx="416" cy="438" rx="30" ry="5" fill="#000" opacity="0.35"/>
      <path d="M386 332 L446 332 L438 436 L394 436 Z" fill="url(#glassC)" stroke="#E8E2D6" stroke-width="1.5"/>
      <g stroke="#FFFFFF" stroke-width="1" opacity="0.35"><line x1="396" y1="336" x2="400" y2="432"/><line x1="408" y1="336" x2="410" y2="432"/><line x1="422" y1="336" x2="422" y2="432"/><line x1="434" y1="336" x2="432" y2="432"/></g>
      <path d="M390 338 L396 430" stroke="#FFFFFF" stroke-width="4" opacity="0.8" stroke-linecap="round"/>
    </g>
  </g>

  <!-- jar of rusks -->
  <g>
    <ellipse cx="600" cy="424" rx="66" ry="8" fill="#000" opacity="0.35"/>
    <g fill="#D69A4E" stroke="#9C6428" stroke-width="1.5">
      <rect x="548" y="380" width="46" height="18" rx="4" transform="rotate(-8 571 389)"/>
      <rect x="598" y="384" width="46" height="18" rx="4" transform="rotate(6 621 393)"/>
      <rect x="560" y="352" width="46" height="18" rx="4" transform="rotate(12 583 361)"/>
      <rect x="604" y="354" width="46" height="18" rx="4" transform="rotate(-10 627 363)"/>
      <rect x="570" y="400" width="46" height="18" rx="4"/>
      <rect x="572" y="326" width="46" height="18" rx="4" transform="rotate(-4 595 335)"/>
    </g>
    <path d="M540 300 L660 300 L664 412 Q664 424 650 424 L550 424 Q536 424 536 412 Z" fill="url(#jar)" stroke="#E6EFEA" stroke-width="2"/>
    <rect x="548" y="276" width="104" height="28" rx="6" fill="#C0392B"/>
    <rect x="548" y="276" width="104" height="8" rx="4" fill="#E36A5C"/>
    <path d="M548 310 L550 414" stroke="#FFFFFF" stroke-width="6" opacity="0.7" stroke-linecap="round"/>
  </g>

  <!-- steel strainer lying on the counter -->
  <g>
    <ellipse cx="712" cy="460" rx="40" ry="16" fill="#B9BDC0" stroke="#6E7275" stroke-width="3"/>
    <ellipse cx="712" cy="460" rx="32" ry="11" fill="#7C8084"/>
    <g stroke="#A7ABAE" stroke-width="1" opacity="0.8">
      <line x1="684" y1="460" x2="740" y2="460"/><line x1="690" y1="454" x2="734" y2="454"/><line x1="690" y1="466" x2="734" y2="466"/>
      <line x1="700" y1="450" x2="700" y2="470"/><line x1="712" y1="449" x2="712" y2="471"/><line x1="724" y1="450" x2="724" y2="470"/>
    </g>
    <path d="M672 462 L600 488" stroke="#8F9396" stroke-width="7" stroke-linecap="round"/>
    <path d="M672 460 L602 485" stroke="#E9ECEE" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- spilled drops -->
  <ellipse cx="500" cy="470" rx="14" ry="4" fill="#8A5A2B" opacity="0.6"/>
  <ellipse cx="526" cy="478" rx="6" ry="2" fill="#8A5A2B" opacity="0.6"/>
</svg>
