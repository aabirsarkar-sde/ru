<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 340"><rect width="240" height="340" fill="#FFF8EE"/><rect x="24" y="24" width="192" height="90" fill="#F2D5A0"/><circle cx="70" cy="68" r="22" fill="#CC5C2F" opacity=".7"/><polygon points="120,110 160,52 200,110" fill="#81204D" opacity=".6"/><text x="24" y="142" font-family="Montserrat,Arial,sans-serif" font-size="12" fill="#333A3D">OPEN MIC NIGHT</text><text x="24" y="160" font-family="Montserrat,Arial,sans-serif" font-size="12" fill="#333A3D">Come and share your poems,</text><text x="24" y="178" font-family="Montserrat,Arial,sans-serif" font-size="12" fill="#333A3D">songs, stories and jokes with</text><text x="24" y="196" font-family="Montserrat,Arial,sans-serif" font-size="12" fill="#333A3D">the whole campus. Everyone is</text><text x="24" y="214" font-family="Montserrat,Arial,sans-serif" font-size="12" fill="#333A3D">welcome, first-timers too.</text><text x="24" y="232" font-family="Montserrat,Arial,sans-serif" font-size="12" fill="#333A3D">Held at the amphitheatre on</text><text x="24" y="250" font-family="Montserrat,Arial,sans-serif" font-size="12" fill="#333A3D">Saturday 14 February from</text><text x="24" y="268" font-family="Montserrat,Arial,sans-serif" font-size="12" fill="#333A3D">6 pm onwards. Free entry.</text><text x="24" y="286" font-family="Montserrat,Arial,sans-serif" font-size="12" fill="#333A3D">Bring a friend. Snacks by the</text><text x="24" y="304" font-family="Montserrat,Arial,sans-serif" font-size="12" fill="#333A3D">student council. See you!</text></svg>